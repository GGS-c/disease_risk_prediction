{% extends 'base.html' %}
{% block title %}Patient Registration - SmartCare AI{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl border border-medical-50 overflow-hidden">
    <div class="px-8 py-8">
        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold text-gray-800">Create an Account</h2>
            <p class="text-gray-500 text-sm mt-1">Join SmartCare to predict and track disease risks.</p>
        </div>
        <form action="/register" method="POST" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" for="name">Full Name</label>
                <input type="text" name="name" id="name" required class="block w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-medical-500 focus:border-medical-500 transition-colors" placeholder="John Doe">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" for="email">Email Address</label>
                <input type="email" name="email" id="email" required class="block w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-medical-500 focus:border-medical-500 transition-colors" placeholder="you@example.com">
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" for="mobile">Mobile</label>
                    <input type="text" name="mobile" id="mobile" required class="block w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-medical-500 focus:border-medical-500 transition-colors" placeholder="1234567890">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" for="age">Age</label>
                    <input type="number" name="age" id="age" required class="block w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-medical-500 focus:border-medical-500 transition-colors" placeholder="25">
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" for="gender">Gender</label>
                <select name="gender" id="gender" class="block w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-medical-500 focus:border-medical-500 transition-colors cursor-pointer">
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" for="password">Password</label>
                <input type="password" name="password" id="password" required class="block w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-medical-500 focus:border-medical-500 transition-colors" placeholder="••••••••">
            </div>
            
            <button type="submit" class="w-full mt-2 flex justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-sm text-sm font-bold text-white bg-medical-600 hover:bg-medical-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-medical-500 transition-all transform hover:-translate-y-0.5">
                Register
            </button>
        </form>
        
        <div class="mt-8 pt-6 border-t border-gray-100 text-center">
            <p class="text-sm text-gray-600">
                Already have an account? <a href="/login" class="font-bold text-medical-600 hover:text-medical-800 transition-colors">Log in</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
